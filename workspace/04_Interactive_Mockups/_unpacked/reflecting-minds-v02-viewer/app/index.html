<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reflecting Minds v0.2 – wireframe mockup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
  <div class="sticky">
  <div class="mock-banner" role="note">MOCK PROTOTYPE v0.2 · fictional content · no AI · nothing leaves this device</div>
  <header class="topbar">
    <button id="back" class="link" aria-label="Back">‹ Back</button>
    <span id="where" class="where"></span>
    <button id="exit" class="link" aria-label="Exit">Exit</button>
  </header>
  </div>
  <nav id="progress" class="progress" aria-label="Stages: open any"></nav>
  <main id="screen" tabindex="-1"></main>
  <footer class="footer">
    <button class="link" data-go="saved">Saved</button>
    <button class="link" data-go="privacyInfo">Privacy</button>
    <button class="link" data-go="report">Report content</button>
  </footer>
</div>
<div id="sheet" class="sheet" hidden></div>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
