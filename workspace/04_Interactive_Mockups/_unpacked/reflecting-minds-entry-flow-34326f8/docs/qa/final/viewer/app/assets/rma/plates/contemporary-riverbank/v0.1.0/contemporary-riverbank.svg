<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Two garden boundaries</title>
  <desc id="desc">Two equal plain markers stand a stride apart between modern garden plots beside a quiet river edge. Neither marker is highlighted.</desc>
  <defs>
    <pattern id="fiber" width="34" height="30" patternUnits="userSpaceOnUse"><path d="M4 7q5-2 10 0M21 19q4-1 8 1M8 27l4-1" fill="none" stroke="#704C39" stroke-width=".7" opacity=".08"/></pattern>
    <filter id="shadow" x="-25%" y="-20%" width="150%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/><feOffset dx="3" dy="4" result="shadow"/><feComponentTransfer><feFuncA type="linear" slope=".24"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="400" fill="#F1C98E"/>
  <path d="M0 0h600v163q-142-16-300 0T0 161z" fill="#EBC084"/>
  <path d="M0 143q124-22 252 0t348-2v126H0z" fill="#91AD7E"/>
  <path d="M0 226q156-16 302 1t298-1v173H0z" fill="#F1C98E"/>
  <path d="M0 285q144-14 290 0t310-1v116H0z" fill="#55A4A9"/>
  <path d="M0 278q140-12 286 0t314-1" fill="none" stroke="#704F3B" stroke-width="2" opacity=".55"/>
  <!-- Two contemporary but unmarked garden plots frame one shared open gap. -->
  <g filter="url(#shadow)" stroke="#704331" stroke-width="2">
    <path d="M31 174h188v45H31z" fill="#E7A268"/><path d="M381 173h188v46H381z" fill="#E7A268"/>
    <path d="M43 184h165m-165 8h165m-165 8h165m-165 8h165m-165 8h165M393 184h164m-164 8h164m-164 8h164m-164 8h164m-164 8h164" fill="none" stroke="#8B553A" stroke-width="1" opacity=".32"/>
  </g>
  <g fill="#668F5F"><path d="M44 169q6-25 19-27 11-20 26-4 15-4 20 13 13 1 16 18zM139 168q7-22 20-25 12-18 25-3 16-3 21 14 12 1 15 16zM397 169q7-24 20-26 12-20 27-4 16-4 22 14 12 1 15 16zM488 168q5-22 19-24 11-19 25-3 16-3 22 13 11 1 14 15z"/></g>
  <g fill="#2F8790" opacity=".8"><path d="M67 165q8-17 20-17 13 0 19 17zM161 164q8-18 21-18 14 0 20 18zM420 164q9-19 22-18 14 0 20 18zM511 164q8-17 21-17 13 0 18 17z"/></g>
  <path d="M0 229q132-14 268 2t332-1" fill="none" stroke="#8B553A" stroke-width="2" opacity=".45"/>
  <!-- Focal: equal plain stakes and the open stride of ground between them. -->
  <g id="focal" stroke="#704331" stroke-width="2">
    <path d="M267 254l3-74h13l2 74z" fill="#F7E2C7"/><path d="M323 254l2-74h13l2 74z" fill="#F7E2C7"/>
    <path d="M272 191h8m47 0h8" stroke="#8B553A" stroke-width="1.5"/>
    <path d="M245 262q46-8 94 0" fill="none" stroke="#8B553A" stroke-width="2" opacity=".45"/>
    <path d="M244 263q48 14 98 0v14q-50 14-98 0z" fill="#E7A268" stroke="#8B553A" stroke-width="1.5" opacity=".72"/>
  </g>
  <path d="M22 322q70-10 140 0m276 1q70-10 140 0M75 344q44-7 88 0m275-1q45-7 90 0" fill="none" stroke="#704331" stroke-width="2" opacity=".48"/>
  <rect width="600" height="400" fill="url(#fiber)" opacity=".3"/>
  <rect width="600" height="400" fill="#704F3B" opacity=".035"/>
</svg>
